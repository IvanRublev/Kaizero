name: Bump Homebrew tap

# On a pushed v* tag, bump url + sha256 in the tap formula.
# dawidd6/action-homebrew-bump-formula@v8 (last released July 2024) calls Homebrew's own
# `safe_system`, which Homebrew removed since — every run now dies with
# "undefined method 'safe_system' for module Homebrew", unrelated to anything in this repo.
# Switched to mislav/bump-homebrew-formula-action, which computes the sha256 itself from
# download-url via the GitHub API rather than shelling out to a local `brew`, so it isn't
# exposed to that kind of Homebrew-internals breakage.
on:
  push:
    tags: ['v*']

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: mislav/bump-homebrew-formula-action@v4
        with:
          formula-name: kaizero
          homebrew-tap: IvanRublev/homebrew-tap
          download-url: https://github.com/IvanRublev/kaizero/archive/refs/tags/${{ github.ref_name }}.tar.gz
          tag-name: ${{ github.ref_name }}
          # Opens a PR on the tap rather than pushing straight to its default branch.
          create-pullrequest: true
        env:
          # PAT with `repo` scope on the tap repo. Store as an Actions secret.
          COMMITTER_TOKEN: ${{ secrets.TAP_TOKEN }}
